---
# Source: helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "eurekaserver-deployment"
  labels:
    app: eureka-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
      
    spec:
      containers:
        - name: "eureka-service-container"
          image: eureka-server-image
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          envFrom:
          - configMapRef:
              name: "eurekaserver-configmap"
              optional: false
          - secretRef:
              name: "eurekaserver-secrets"
              optional: false
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 1536Mi
            requests:
              cpu: 500m
              memory: 512Mi
