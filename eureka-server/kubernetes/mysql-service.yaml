apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: mysql-db
spec:
  type: ClusterIP
  selector:
    app: mysql-db
  ports:
    - name: http
      port: 3306        # external port inside cluster
      targetPort: 3306  # maps to container port
  #    nodePort: 30909   # only if type=NodePort
  #type: NodePort        # use LoadBalancer if on cloud

