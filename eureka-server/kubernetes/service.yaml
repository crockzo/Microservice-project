apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  labels:
    app: eureka-server
spec:
  type: ClusterIP
  selector:
    app: eureka-server
  ports:
    - name: http
      port: 9090        # external port inside cluster
      targetPort: 8761  # maps to container port
  #    nodePort: 30909   # only if type=NodePort
  #type: NodePort        # use LoadBalancer if on cloud

